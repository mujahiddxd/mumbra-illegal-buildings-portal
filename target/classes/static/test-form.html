<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Simple Test Form</h2>
        
        <div class="mb-3">
            <label for="testLocation" class="form-label">Location</label>
            <input type="text" id="testLocation" class="form-control" placeholder="Enter location">
        </div>
        
        <div class="mb-3">
            <label for="testImage" class="form-label">Image</label>
            <input type="file" id="testImage" class="form-control" accept="image/*">
        </div>
        
        <div class="mb-3">
            <img id="testPreview" style="max-width: 200px; display: none;" />
        </div>
        
        <button id="testSubmit" class="btn btn-primary">Test Submit</button>
        
        <div id="testResult" class="mt-3"></div>
    </div>

    <script>
        // Image preview
        document.getElementById('testImage').addEventListener('change', function() {
            const file = this.files[0];
            const preview = document.getElementById('testPreview');
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                preview.style.display = 'none';
            }
        });

        // Form submission
        document.getElementById('testSubmit').addEventListener('click', async function() {
            alert('TEST BUTTON CLICKED!');
            
            const location = document.getElementById('testLocation').value;
            const imageInput = document.getElementById('testImage');
            const resultDiv = document.getElementById('testResult');
            
            if (!location) {
                alert('Please enter a location');
                return;
            }
            
            let imageUrl = '/images/buildings/default-building.jpg';
            
            // Handle image if selected
            if (imageInput.files && imageInput.files[0]) {
                try {
                    const file = imageInput.files[0];
                    alert('Converting image: ' + file.name);
                    
                    const base64 = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result);
                        reader.onerror = reject;
                        reader.readAsDataURL(file);
                    });
                    
                    imageUrl = base64;
                    alert('Image converted! Length: ' + base64.length);
                } catch (error) {
                    alert('Error converting image: ' + error.message);
                }
            }
            
            // Prepare data
            const formData = {
                name: location + ' Test Building',
                address: location,
                location: location,
                wardNumber: '16',
                floors: '1',
                category: 'Unauthorized construction',
                violationType: 'unauthorized',
                latitude: 19.1750,
                longitude: 73.0100,
                severity: 'HIGH',
                status: 'PENDING',
                description: 'Test submission with image',
                imageUrl: imageUrl
            };
            
            alert('Submitting data...');
            console.log('Form data:', formData);
            
            try {
                const response = await fetch('/api/buildings', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    alert('SUCCESS! Building ID: ' + result.id);
                    resultDiv.innerHTML = '<div class="alert alert-success">Success! Building created with ID: ' + result.id + '</div>';
                    
                    // Reset form
                    document.getElementById('testLocation').value = '';
                    document.getElementById('testImage').value = '';
                    document.getElementById('testPreview').style.display = 'none';
                } else {
                    const errorText = await response.text();
                    alert('ERROR: ' + errorText);
                    resultDiv.innerHTML = '<div class="alert alert-danger">Error: ' + errorText + '</div>';
                }
            } catch (error) {
                alert('NETWORK ERROR: ' + error.message);
                resultDiv.innerHTML = '<div class="alert alert-danger">Network Error: ' + error.message + '</div>';
            }
        });
    </script>
</body>
</html>
