<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="index-page">
    <div class="container" style="max-width: 500px; padding-top: 120px; padding-bottom: 60px;">
        <h2 class="mb-3 text-center">Create Account</h2>
        <p class="text-muted text-center mb-4">Sign up to track your reports and status.</p>

        <form id="signupForm" class="card p-4">
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" minlength="6" required>
            </div>
            <div class="mb-3">
                <label for="confirm" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirm" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Create Account</button>
            <a href="/login.html" class="btn btn-light w-100 mt-2">Already have an account? Login</a>
        </form>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
        
            const username = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
        
            if (password !== confirm) {
                alert('Passwords do not match.');
                return;
            }
        
            try {
                const res = await fetch('http://localhost:8080/users', {  // Spring Boot URL
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
        
                if (res.ok) {
                    alert('Account created successfully!');
                    window.location.href = '/login.html';
                } else {
                    const errorText = await res.text();
                    alert('Error: ' + errorText);
                }
            } catch (err) {
                console.error(err);
                alert('Server error');
            }
        });
        </script>
        
</body>
</html>
